# pj_price 専用 商品名パースプロキシ（Cloudflare Worker）
# APIキーはここに書かない。デプロイ時に `wrangler secret put ANTHROPIC_API_KEY` で登録する。
name = "pj-price"
main = "worker.js"
compatibility_date = "2025-09-01"

# workers.dev の既定サブドメインで公開（独自ドメインは使わない）。
workers_dev = true

# account_id は `wrangler` が対話補完するか、環境変数 CLOUDFLARE_ACCOUNT_ID で渡す。
# 秘密情報ではないが、リポジトリに固定しないでおく。
# account_id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
